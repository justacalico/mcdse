stages:
  - test
  - build
  - pages
  - deploy

image: debian:stable-slim

default:
  tags:
    - linux-truenas

variables:
  FF_DISABLE_GPU: "true"
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_HOME: "$CI_PROJECT_DIR/.flutter-sdk"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pub-cache/
    - .flutter-sdk/

before_script:
  - apt-get update -qq && apt-get install -y -qq curl xz-utils git ca-certificates unzip
  - |
    if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
      curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar -xJ
      mv flutter "$FLUTTER_HOME"
    fi
  - export PATH="$FLUTTER_HOME/bin:$PATH:$HOME/.pub-cache/bin"
  - git config --global --add safe.directory "$FLUTTER_HOME"
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  - flutter config --no-analytics --no-cli-animations
  - flutter pub get

test:
  stage: test
  script:
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test

build:linux:
  stage: build
  script:
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    - flutter build linux --release
    - tar -czf mcdse-linux-x64.tar.gz -C build/linux/x64/release/bundle .
  artifacts:
    paths:
      - mcdse-linux-x64.tar.gz
    expire_in: 30 days

pages:
  stage: pages
  dependencies: []
  script:
    - mkdir -p public
    - cp -r landing/* public/
  artifacts:
    paths:
      - public
  only:
    - master
    - main
