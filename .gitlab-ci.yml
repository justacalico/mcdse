stages:
  - test
  - build
  - pages
  - deploy

image: ghcr.io/cirruslabs/flutter:stable

variables:
  FF_DISABLE_GPU: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pub-cache/

before_script:
  - export PATH="$PATH:$HOME/.pub-cache/bin"
  - flutter pub get

test:
  stage: test
  script:
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test

build:linux:
  stage: build
  script:
    - apt-get update -qq && apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    - flutter build linux --release
    - tar -czf mcdse-linux-x64.tar.gz -C build/linux/x64/release/bundle .
  artifacts:
    paths:
      - mcdse-linux-x64.tar.gz
    expire_in: 30 days

pages:
  stage: pages
  dependencies: []
  script:
    - mkdir -p public
    - cp -r landing/* public/
  artifacts:
    paths:
      - public
  only:
    - master
    - main
